# OpenWalkieTalkie Rev A and Rev B (OWT_BOARD=hw-a or hw-b; the microphone is
# the same on both). tools/build-native.sh copies this file
# to native/project/openwalkietalkie_hcpu/proj.conf, the SDK's per-board overlay
# that is merged after proj.conf for the main project only (the LCPU and
# bootloader child projects never see it). The dev board build has no overlay.
#
# The MP34DT05 is a PDM microphone on PA22 (clock) / PA23 (data) whose 3.3 V
# comes through a load switch on PA28, so the audio server's receive path is
# PDM1 rather than the dev board's on-chip codec microphone. The PDM clock stays
# on the 9.6 MHz crystal-derived source: 1.6 MHz at 16 kHz, inside the
# microphone's 1.2-3.25 MHz range.
CONFIG_BSP_USING_PDM=y
CONFIG_BSP_USING_PDM1=y
# CONFIG_BSP_PDM_CLK_USE_PLL is not set
# CONFIG_AUDIO_MIC_USING_CODEC is not set
CONFIG_AUDIO_RX_USING_PDM=y
