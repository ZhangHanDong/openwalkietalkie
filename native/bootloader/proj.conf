CONFIG_BSP_USING_NO_OS=y
# CONFIG_BSP_USING_DMA is not set
# CONFIG_BSP_USING_MPI is not set
# CONFIG_BSP_USING_EXT_DMA is not set
# CONFIG_BSP_USING_HW_AES is not set
CONFIG_USING_PARTITION_TABLE=y
# Signed/encrypted images are not used (ftab flags are DFU_FLAG_AUTO only); the
# RSA verifier is ~20 KB of the 64 KB slot and makes no room for USB.
# CONFIG_PKG_SIFLI_MBEDTLS_BOOT is not set
# CONFIG_PKG_USING_FLASHDB is not set
# USB DFU recovery: CherryUSB on the SiFli musb port, bare metal (as the SDK's
# own sf32lb57x ROM project builds it).
CONFIG_PKG_USING_CHERRYUSB=y
CONFIG_PKG_CHERRYUSB_DEVICE=y
CONFIG_PKG_CHERRYUSB_DEVICE_SPEED_FS=y
# "custom" port: owt/ carries the musb port (one EP0 fix) and the SiFli glue.
CONFIG_PKG_CHERRYUSB_DEVICE_CUSTOM=y
# Recovery is the application's own vendor HID device (owt/recovery.c).
CONFIG_PKG_CHERRYUSB_DEVICE_HID=y
