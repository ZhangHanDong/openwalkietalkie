[package]
name = "openwalkietalkie-native-core"
version = "0.3.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
embedded-hal = "1.0"
embedded-graphics = "0.8"
profont = "0.7"
defmt = "1"

[features]
# Rev A hardware (180-degree panel mounting); see the root manifest.
hw-a = []
# Rev B hardware: Rev A plus the charger's CHG pin; see the root manifest.
hw-b = ["hw-a"]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1

# The render tests draw thousands of complete frames (the fuzz walk alone
# 3000): minutes unoptimised, seconds like this. Debug assertions and overflow
# checks stay on.
[profile.test]
opt-level = 2
