CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_BLUETOOTH=y
CONFIG_BSP_USING_PM=y
# Ordinary WFI did not prevent the USB/touch HardFault. Keep this comparison
# setting while validating the clock-transition SRAM placement fix; restore
# deep-WFI only after physical unplug/wake validation.
# CONFIG_BSP_PM_FREQ_SCALING is not set
CONFIG_PM_LIGHT_ENABLE=y
# CONFIG_PM_DEEP_ENABLE is not set
# CONFIG_PM_STANDBY_ENABLE is not set
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_LVL_W=y
CONFIG_ULOG_USING_ISR_LOG=y
CONFIG_ULOG_OUTPUT_FLOAT=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_CONSOLEBUF_SIZE=256
CONFIG_RT_MAIN_THREAD_STACK_SIZE=24576
CONFIG_RT_TIMER_THREAD_STACK_SIZE=2048
CONFIG_RT_USING_RTT_CMSIS=y
CONFIG_BLUETOOTH=y
# CONFIG_BT_RF_TEST is not set
# CONFIG_BLE_GAP_CENTRAL is not set
# CONFIG_BLE_GATT_CLIENT is not set
CONFIG_BSP_BLE_CONNECTION_MANAGER=y
CONFIG_BLE_CM_RESOLVE_ADDRESS=y
CONFIG_BLE_CTKD_ENABLE=y
# CONFIG_BLE_CTKD_BREDR_LK_TO_LE_LTK is not set
CONFIG_BT_FINSH=y
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_HFP_HF=y
CONFIG_CFG_AV=y
CONFIG_CFG_AV_SNK=y
CONFIG_CFG_AVRCP=y
CONFIG_BT_AUTO_CONNECT_LAST_DEVICE=y
# CONFIG_BSP_BT_APP is not set
# CONFIG_BTS2_APP_MENU is not set
# CONFIG_HCI_ON_LOG is not set
# CONFIG_HCI_ON_FLASH is not set
# CONFIG_LOG_ON_CONSOLE is not set
# CONFIG_NVDS_AUTO_UPDATE_MAC_ADDRESS is not set
CONFIG_AUDIO=y
CONFIG_AUDIO_PATH_USING_HCPU=y
CONFIG_AUDIO_SPEAKER_USING_CODEC=y
CONFIG_PKG_USING_FLASHDB=y
CONFIG_PKG_USING_WEBRTC=y
CONFIG_WEBRTC_AGC_FIX=y
CONFIG_WEBRTC_AECM=y
CONFIG_PSRAM_CACHE_WB=y
CONFIG_LXT_DISABLE=y
